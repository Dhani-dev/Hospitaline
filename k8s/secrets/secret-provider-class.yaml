apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hospitaline-db-secrets
  namespace: hospitaline-prod
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/project-39d0c894-3885-4211-89d/secrets/hospitaline-db-user/versions/latest"
        path: "DB_USER"
      - resourceName: "projects/project-39d0c894-3885-4211-89d/secrets/hospitaline-db-password/versions/latest"
        path: "DB_PASSWORD"
      - resourceName: "projects/project-39d0c894-3885-4211-89d/secrets/hospitaline-db-name/versions/latest"
        path: "DB_NAME"