apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospitaline-redis
  namespace: hospitaline-prod
  labels:
    app: hospitaline-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospitaline-redis
  template:
    metadata:
      labels:
        app: hospitaline-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hospitaline-prod
spec:
  selector:
    app: hospitaline-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
