version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.test
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "60"
      PEER_CACHE_TTL_SECONDS: "30"
    ports:
      - "3000:3000"
    depends_on:
      - redis
    command: npm run start
